<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ role }} Portal | CivicConnect</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
</head>

<body class="bg-light">

    <!-- Navbar -->

    <nav class="navbar navbar-expand-lg navbar-dark bg-{{ color }}">
        <div class="container">
            <a class="navbar-brand fw-bold" href="/">🏙 CivicConnect</a>

            <span class="navbar-text text-white fw-semibold">
                {{ role }} Portal
            </span>
        </div>
    </nav>

    <!-- Main -->

    <div class="container mt-5">

        <div class="row justify-content-center">

            <div class="col-lg-6 col-md-8">

                <div class="card shadow border-0 rounded-4">

                    <div class="card-body p-5">

                        <div class="text-center">

                            <i class="bi bi-person-circle display-1 text-{{ color }}"></i>

                            <h2 class="mt-3">
                                {{ role }} Login
                            </h2>

                            <p class="text-muted">
                                Login to continue to CivicConnect
                            </p>

                        </div>

                        <!-- Messages -->

                        {% if message %}

                        <div class="alert alert-{{ category }}">
                            {{ message }}
                        </div>

                        {% endif %}

                        <!-- Login Form -->

                        <form method="POST">

                            <input type="hidden"
                                   name="action"
                                   value="login">

                            <div class="mb-3">

                                <label class="form-label">
                                    Username
                                </label>

                                <input
                                    type="text"
                                    name="username"
                                    class="form-control"
                                    required>

                            </div>

                            <div class="mb-3">

                                <label class="form-label">
                                    Password
                                </label>

                                <input
                                    type="password"
                                    name="password"
                                    class="form-control"
                                    required>

                            </div>

                            <button
                                type="submit"
                                class="btn btn-{{ color }} w-100">

                                Login

                            </button>

                        </form>

                        <hr>

                        <div class="text-center">

                            <p class="mb-2">
                                Don't have an account?
                            </p>

                            <button
                                type="button"
                                class="btn btn-outline-{{ color }}"
                                data-bs-toggle="modal"
                                data-bs-target="#registerModal">

                                Register

                            </button>

                        </div>

                        <div class="text-center mt-4">

                            <a href="/" class="text-decoration-none">

                                ← Back to Home

                            </a>

                        </div>

                    </div>

                </div>

            </div>

        </div>

    </div>

    <!-- Register Modal -->

    <div class="modal fade"
         id="registerModal"
         tabindex="-1">

        <div class="modal-dialog">

            <div class="modal-content">

                <div class="modal-header">

                    <h5 class="modal-title">

                        Register as {{ role }}

                    </h5>

                    <button
                        type="button"
                        class="btn-close"
                        data-bs-dismiss="modal">
                    </button>

                </div>

                <div class="modal-body">

                    <form method="POST">

                        <input
                            type="hidden"
                            name="action"
                            value="register">

                        <div class="mb-3">

                            <label class="form-label">

                                Username

                            </label>

                            <input
                                type="text"
                                name="username"
                                class="form-control"
                                required>

                        </div>

                        <div class="mb-3">

                            <label class="form-label">

                                Password

                            </label>

                            <input
                                type="password"
                                name="password"
                                class="form-control"
                                required>

                        </div>

                        <div class="mb-3">

                            <label class="form-label">

                                Confirm Password

                            </label>

                            <input
                                type="password"
                                name="confirm_password"
                                class="form-control"
                                required>

                        </div>

                        <button
                            type="submit"
                            class="btn btn-{{ color }} w-100">

                            Register

                        </button>

                    </form>

                </div>

            </div>

        </div>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

    {% if message and category == "danger" %}
    <script>

        document.addEventListener("DOMContentLoaded", function () {

            const registerModal = new bootstrap.Modal(
                document.getElementById("registerModal")
            );

            registerModal.show();

        });

    </script>
    {% endif %}

</body>

</html>
