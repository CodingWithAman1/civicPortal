<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Create Volunteer Drive</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">

<style>

body{
    background:#f5f7f8;
}

.hero{
    background:linear-gradient(135deg,#198754,#2fb96d);
    color:white;
    padding:35px;
    border-radius:20px;
}

.card{
    border:none;
    border-radius:18px;
}

</style>

</head>

<body>

<div class="container py-5">

<div class="hero mb-4">

<h2>

<i class="bi bi-megaphone-fill"></i>

Create Volunteer Drive

</h2>

<p class="mb-0">

Invite citizens to help solve a community issue.

</p>

</div>

<div class="card shadow">

<div class="card-body p-4">

<form method="POST">

<div class="mb-3">

<label class="form-label">

Drive Title

</label>

<input
type="text"
class="form-control"
name="title"
required>

</div>

<div class="mb-3">

<label class="form-label">

Description

</label>

<textarea
class="form-control"
rows="4"
name="description"
required></textarea>

</div>

<div class="row">

<div class="col-md-6 mb-3">

<label class="form-label">

Meeting Point

</label>

<input
type="text"
class="form-control"
name="meeting_point"
required>

</div>

<div class="col-md-6 mb-3">

<label class="form-label">

Contact Number

</label>

<input
type="text"
class="form-control"
name="contact">

</div>

</div>

<div class="row">

<div class="col-md-4 mb-3">

<label class="form-label">

Date

</label>

<input
type="date"
class="form-control"
name="date"
required>

</div>

<div class="col-md-4 mb-3">

<label class="form-label">

Time

</label>

<input
type="time"
class="form-control"
name="time"
required>

</div>

<div class="col-md-4 mb-3">

<label class="form-label">

Volunteers Needed

</label>

<input
type="number"
class="form-control"
name="needed"
required>

</div>

</div>

<div class="mb-4">

<label class="form-label">

Special Instructions

</label>

<textarea
class="form-control"
rows="3"
name="instructions"
placeholder="Bring gloves, wear shoes, carry water, etc."></textarea>

</div>

<div class="d-flex justify-content-between">

<a
href="{{ url_for('dashboard') }}"
class="btn btn-secondary">

<i class="bi bi-arrow-left"></i>

Back

</a>

<button
class="btn btn-success">

<i class="bi bi-check-circle-fill"></i>

Create Drive

</button>

</div>

</form>

</div>

</div>

</div>

</body>

</html>
